<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100" width="80" height="100">
  <defs>
    <style>
      @keyframes catBounce {
        0%,100% { transform: translateY(0); }
        50%     { transform: translateY(-6px); }
      }
      .cat { animation: catBounce 2.6s ease-in-out infinite; }
    </style>
  </defs>

  <g class="cat">
    <!-- ── Row 0: ear tips ── -->
    <rect x="10" y="0"  width="10" height="10" fill="#E880B0"/>
    <rect x="60" y="0"  width="10" height="10" fill="#E880B0"/>

    <!-- ── Row 1: ears + head top ── -->
    <rect x="0"  y="10" width="10" height="10" fill="#E880B0"/>
    <rect x="10" y="10" width="10" height="10" fill="#E880B0"/>
    <rect x="20" y="10" width="10" height="10" fill="#FFCCE0"/><!-- inner ear -->
    <rect x="30" y="10" width="10" height="10" fill="#F5B0CC"/>
    <rect x="40" y="10" width="10" height="10" fill="#F5B0CC"/>
    <rect x="50" y="10" width="10" height="10" fill="#FFCCE0"/><!-- inner ear -->
    <rect x="60" y="10" width="10" height="10" fill="#E880B0"/>
    <rect x="70" y="10" width="10" height="10" fill="#E880B0"/>

    <!-- ── Row 2: full head ── -->
    <rect x="0"  y="20" width="80" height="10" fill="#F5B0CC"/>

    <!-- ── Row 3: eyes row top ── -->
    <rect x="0"  y="30" width="10" height="10" fill="#F5B0CC"/>
    <rect x="10" y="30" width="10" height="10" fill="#62304C"/><!-- L eye -->
    <rect x="20" y="30" width="10" height="10" fill="#62304C"/><!-- L eye -->
    <rect x="30" y="30" width="10" height="10" fill="#F5B0CC"/>
    <rect x="40" y="30" width="10" height="10" fill="#F5B0CC"/>
    <rect x="50" y="30" width="10" height="10" fill="#62304C"/><!-- R eye -->
    <rect x="60" y="30" width="10" height="10" fill="#62304C"/><!-- R eye -->
    <rect x="70" y="30" width="10" height="10" fill="#F5B0CC"/>

    <!-- ── Row 4: nose ── -->
    <rect x="0"  y="40" width="10" height="10" fill="#F5B0CC"/>
    <rect x="10" y="40" width="10" height="10" fill="#F5B0CC"/>
    <rect x="20" y="40" width="10" height="10" fill="#F5B0CC"/>
    <rect x="30" y="40" width="10" height="10" fill="#E8508A"/><!-- nose -->
    <rect x="40" y="40" width="10" height="10" fill="#E8508A"/><!-- nose -->
    <rect x="50" y="40" width="10" height="10" fill="#F5B0CC"/>
    <rect x="60" y="40" width="10" height="10" fill="#F5B0CC"/>
    <rect x="70" y="40" width="10" height="10" fill="#F5B0CC"/>

    <!-- ── Rows 5–7: body ── -->
    <rect x="0"  y="50" width="80" height="10" fill="#F5B0CC"/>
    <rect x="0"  y="60" width="80" height="10" fill="#F5B0CC"/>
    <rect x="0"  y="70" width="80" height="10" fill="#F5B0CC"/>

    <!-- ── Rows 8–9: paws ── -->
    <rect x="10" y="80" width="10" height="10" fill="#F5B0CC"/>
    <rect x="20" y="80" width="10" height="10" fill="#F5B0CC"/>
    <rect x="50" y="80" width="10" height="10" fill="#F5B0CC"/>
    <rect x="60" y="80" width="10" height="10" fill="#F5B0CC"/>
    <rect x="10" y="90" width="10" height="10" fill="#EFAAC4"/>
    <rect x="20" y="90" width="10" height="10" fill="#EFAAC4"/>
    <rect x="50" y="90" width="10" height="10" fill="#EFAAC4"/>
    <rect x="60" y="90" width="10" height="10" fill="#EFAAC4"/>

    <!-- ── Eye shine ── -->
    <rect x="12" y="32" width="4" height="4" fill="white" opacity=".8"/>
    <rect x="52" y="32" width="4" height="4" fill="white" opacity=".8"/>

    <!-- ── Blush circles ── -->
    <circle cx="17" cy="48" r="6" fill="#FFB0CC" opacity=".35"/>
    <circle cx="63" cy="48" r="6" fill="#FFB0CC" opacity=".35"/>
  </g>
</svg>
