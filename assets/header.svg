<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" width="820" height="220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FCE4F0"/>
      <stop offset="45%"  stop-color="#F9D5EC"/>
      <stop offset="100%" stop-color="#E8D0F5"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#C06090"/>
      <stop offset="100%" stop-color="#9060B8"/>
    </linearGradient>
    <style>
      @keyframes floatA {
        0%,100% { transform: translateY(0px); opacity:.85; }
        50%     { transform: translateY(-10px); opacity:1; }
      }
      @keyframes floatB {
        0%,100% { transform: translateY(0px); opacity:.6; }
        50%     { transform: translateY(-7px); opacity:.9; }
      }
      @keyframes twinkle {
        0%,100% { transform: scale(.7); opacity:.3; }
        50%     { transform: scale(1.3); opacity:1; }
      }
      @keyframes fadeSlideIn {
        0%   { transform: translateY(16px); opacity:0; }
        100% { transform: translateY(0);    opacity:1; }
      }
      @keyframes bowBounce {
        0%,100% { transform: translateY(0) rotate(-3deg); }
        50%     { transform: translateY(-6px) rotate(3deg); }
      }

      .h1  { font-family: Georgia,'Times New Roman',serif; font-size:52px; font-style:italic; font-weight:bold; fill:url(#textGrad); animation: fadeSlideIn 1.1s ease-out both; }
      .h2  { font-family: Arial,sans-serif; font-size:14px; letter-spacing:4px; fill:#9B78B2; text-transform:uppercase; animation: fadeSlideIn 1.4s ease-out .2s both; }

      .fA1 { animation: floatA 3.2s ease-in-out infinite; transform-origin:center; }
      .fA2 { animation: floatA 3.8s ease-in-out infinite .6s; transform-origin:center; }
      .fB1 { animation: floatB 4.1s ease-in-out infinite .3s; transform-origin:center; }
      .fB2 { animation: floatB 3.5s ease-in-out infinite 1s; transform-origin:center; }
      .sp1 { animation: twinkle 2.4s ease-in-out infinite; transform-origin:center; }
      .sp2 { animation: twinkle 3.1s ease-in-out infinite .9s; transform-origin:center; }
      .sp3 { animation: twinkle 2.0s ease-in-out infinite .4s; transform-origin:center; }
      .sp4 { animation: twinkle 2.8s ease-in-out infinite 1.3s; transform-origin:center; }
      .bow { animation: bowBounce 4s ease-in-out infinite; transform-origin:410px 72px; }
    </style>
  </defs>

  <!-- Background card -->
  <rect width="820" height="220" fill="url(#bg)" rx="20"/>

  <!-- Soft blobs -->
  <ellipse cx="90"  cy="50"  rx="55" ry="45" fill="#F4B8D8" opacity=".18"/>
  <ellipse cx="730" cy="175" rx="65" ry="50" fill="#C8A8E8" opacity=".16"/>
  <ellipse cx="410" cy="8"   rx="120" ry="30" fill="#FCD8EE" opacity=".12"/>

  <!-- === Left hearts === -->
  <text class="fA1" x="52"  y="90"  font-size="26" fill="#E890B8">♡</text>
  <text class="fB1" x="82"  y="148" font-size="17" fill="#F0A8CC" opacity=".75">♡</text>
  <text class="fA2" x="30"  y="158" font-size="13" fill="#D87AAC" opacity=".6">♡</text>

  <!-- === Right hearts === -->
  <text class="fA2" x="730" y="78"  font-size="22" fill="#C8A0E0">♡</text>
  <text class="fB2" x="758" y="128" font-size="15" fill="#E090C8" opacity=".7">♡</text>
  <text class="fB1" x="715" y="162" font-size="19" fill="#B888D0" opacity=".6">♡</text>

  <!-- === Sparkles === -->
  <text class="sp1" x="158" y="42"  font-size="18" fill="#EFC0D8">✦</text>
  <text class="sp2" x="655" y="38"  font-size="14" fill="#D0B0E8">✦</text>
  <text class="sp3" x="410" y="24"  font-size="16" fill="#F0A8C0" opacity=".75">✦</text>
  <text class="sp4" x="600" y="195" font-size="13" fill="#C0A8D8" opacity=".7">✦</text>
  <text class="sp1" x="215" y="195" font-size="11" fill="#E8B0C8" opacity=".65">✦</text>
  <text class="sp2" x="118" y="30"  font-size="12" fill="#E0A0C0" opacity=".6">✦</text>

  <!-- === Flowers === -->
  <text x="195" y="202" font-size="22" fill="#F0B0CC" opacity=".55">✿</text>
  <text x="590" y="208" font-size="17" fill="#C8B0E0" opacity=".5">✿</text>
  <text x="128" y="200" font-size="14" fill="#E8A0C0" opacity=".45">✾</text>
  <text x="668" y="38"  font-size="15" fill="#C0A0D8" opacity=".5">✾</text>

  <!-- === Bow ribbon === -->
  <g class="bow">
    <!-- left wing -->
    <path d="M370,60 Q350,48 340,55 Q338,65 355,68 Z" fill="#E898C0" opacity=".9"/>
    <!-- right wing -->
    <path d="M450,60 Q470,48 480,55 Q482,65 465,68 Z" fill="#E898C0" opacity=".9"/>
    <!-- center knot -->
    <ellipse cx="410" cy="63" rx="11" ry="9" fill="#D870A8"/>
    <!-- ribbon tails -->
    <path d="M400,70 Q390,80 384,88" stroke="#E898C0" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>
    <path d="M420,70 Q430,80 436,88" stroke="#E898C0" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>
  </g>

  <!-- === Main title === -->
  <text class="h1" x="410" y="148" text-anchor="middle">hi, i'm Burcu ♡</text>

  <!-- === Subtitle === -->
  <text class="h2" x="410" y="176" text-anchor="middle">ai · data · code · curiosity</text>
</svg>
